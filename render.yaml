# Render Blueprint: Keystride API (Express + MongoDB Atlas).
# Dashboard → New → Blueprint → pick this repo. Deploys main after GitHub checks pass.
services:
  - type: web
    name: keystride-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    # Only redeploy when API-side code changes.
    buildFilter:
      paths:
        - api/**
        - packages/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - render.yaml
    buildCommand: npx --yes pnpm@11.20.0 install --frozen-lockfile --filter "api..."
    startCommand: cd api && ./node_modules/.bin/tsx src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Visitor → Vercel proxy → Render load balancer → app.
      - key: TRUST_PROXY
        value: "2"
